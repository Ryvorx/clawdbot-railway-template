[build]
builder = "dockerfile"

[deploy]
# Public endpoint exposed by src/server.js. Keep this path in sync with the wrapper.
healthCheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# Require a persistent volume mounted at /data (Railway).
requiredMountPath = "/data"

[variables]
# NOTE: Railway injects PORT automatically.
# Do not set PORT here; Railway templates may not apply it reliably and hardcoding
# can cause domain routing mismatches.
OPENCLAW_STATE_DIR = "/data/.openclaw"
OPENCLAW_WORKSPACE_DIR = "/data/workspace"

# OpenClaw's gateway runs behind the Railway wrapper on loopback.
# 8080/$PORT is the wrapper/public port; 18789 is the OpenClaw gateway port.
OPENCLAW_GATEWAY_PORT = "18789"
